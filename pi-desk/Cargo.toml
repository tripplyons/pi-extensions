[package]
name = "pi-desk"
version = "0.1.0"
edition = "2024"
description = "A desktop inbox for parallel Pi agents, each in its own git worktree"
publish = false

[dependencies]
# Rune is pre-release. Pin a revision of its `dev` branch, which is never rewritten.
rune = { git = "https://github.com/anomalyco/rune", rev = "a7f276c3630f85a06a0230295da4d2bd172d8d3b", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "a7f276c3630f85a06a0230295da4d2bd172d8d3b", features = ["markdown"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "rt-multi-thread", "macros", "time"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7"] }
base64 = "0.22"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

[dev-dependencies]
tempfile = "3"
png = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
