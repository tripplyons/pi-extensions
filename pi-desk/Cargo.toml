[package]
name = "pi-desk"
version = "0.1.0"
edition = "2024"
description = "A desktop inbox for parallel Pi agents, each in its own git worktree"
publish = false

[dependencies]
iced = { version = "0.14", features = ["tokio", "markdown", "highlighter", "advanced"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7"] }
rfd = "0.17"

# Keep text origins on physical pixels after display and UI scaling.
[patch.crates-io]
iced_wgpu = { path = "vendor/iced_wgpu" }
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }

[dev-dependencies]
tempfile = "3"
iced_test = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
